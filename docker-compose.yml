services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yada_user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yada_yada_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
